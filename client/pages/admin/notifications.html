<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notifications — EduSync</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <script src="/js/theme-flash-fix.js"></script>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__brand">
        <span class="brand-logo"><img src="/assets/edusync-logo.png" alt="EduSync" /></span>
      </div>
      <div class="app-header__actions">
        <div class="app-header__user">
          <span id="shell-user-name" class="app-header__user-name"></span>
          <span id="shell-user-role" class="app-header__user-role badge"></span>
        </div>
        <button
          type="button"
          id="theme-toggle"
          class="btn btn--secondary"
          aria-label="Toggle dark mode"
        >
          <span id="theme-toggle-label">Dark mode</span>
        </button>
        <button type="button" id="shell-logout-btn" class="btn btn--secondary">Logout</button>
      </div>
    </header>

    <div class="app-body">
      <aside class="app-sidebar">
        <nav id="shell-sidebar-nav" aria-label="Main navigation"></nav>
      </aside>

      <main class="app-content">
        <div class="container">
          <div class="dashboard-section__header">
            <h1>Notifications</h1>
            <button type="button" id="broadcast-btn" class="btn btn--primary">Send Broadcast</button>
          </div>

          <div id="shell-page-alert" aria-live="polite"></div>
          <div id="notifications-toolbar" class="notifications-toolbar">
            <span id="notifications-summary" class="notifications-summary" aria-live="polite"></span>
            <label class="notifications-filter-label" for="notifications-unread-only">
              <input type="checkbox" id="notifications-unread-only" />
              Show unread only
            </label>
            <button type="button" id="notifications-mark-all-read" class="btn btn--secondary" disabled>
              Mark All as Read
            </button>
          </div>

          <div id="notifications-alert" aria-live="polite"></div>

          <div id="notifications-list" class="notification-list"></div>
        </div>
      </main>
    </div>

    <nav id="shell-bottom-nav" class="bottom-nav" aria-label="Main navigation"></nav>
  </div>

  <div id="broadcast-modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="broadcast-modal-title">
      <h2 id="broadcast-modal-title">Send Broadcast</h2>
      <div id="broadcast-form-alert" aria-live="polite"></div>
      <form id="broadcast-form" novalidate>
        <div class="form-field">
          <label class="form-label" for="broadcast-audience">Audience</label>
          <select class="form-input" id="broadcast-audience" required>
            <option value="EVERYONE">Everyone</option>
            <option value="STUDENTS">Students</option>
            <option value="DOCTORS">Doctors</option>
            <option value="TAS">TAs</option>
            <option value="LEADERS">Leaders</option>
          </select>
          <p class="form-hint">Admin always receives every broadcast, regardless of audience.</p>
        </div>
        <div class="form-field">
          <label class="form-label" for="broadcast-title">Title</label>
          <input class="form-input" type="text" id="broadcast-title" required maxlength="200" />
        </div>
        <div class="form-field">
          <label class="form-label" for="broadcast-message">Message</label>
          <textarea class="form-input" id="broadcast-message" rows="4" required maxlength="2000"></textarea>
        </div>
        <div class="class-card__actions">
          <button type="submit" class="btn btn--primary" id="broadcast-form-submit">Send</button>
          <button type="button" class="btn btn--secondary" id="broadcast-form-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/pages/admin-notifications.js"></script>
</body>
</html>
