<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tasks — EduSync</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <script src="/js/theme-flash-fix.js"></script>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__brand">
        <span class="brand-logo"><img src="/assets/edusync-logo.png" alt="EduSync" /></span>
      </div>
      <div class="app-header__actions">
        <div class="app-header__user">
          <span id="shell-user-name" class="app-header__user-name"></span>
          <span id="shell-user-role" class="app-header__user-role badge"></span>
        </div>
        <button
          type="button"
          id="theme-toggle"
          class="btn btn--secondary"
          aria-label="Toggle dark mode"
        >
          <span id="theme-toggle-label">Dark mode</span>
        </button>
        <button type="button" id="shell-logout-btn" class="btn btn--secondary">Logout</button>
      </div>
    </header>

    <div class="app-body">
      <aside class="app-sidebar">
        <nav id="shell-sidebar-nav" aria-label="Main navigation"></nav>
      </aside>

      <main class="app-content">
        <div class="container">
          <div class="dashboard-section__header">
            <h1>Tasks</h1>
            <button type="button" id="create-task-btn" class="btn btn--primary">Create Task</button>
          </div>

          <div id="shell-page-alert" aria-live="polite"></div>
          <div id="task-filters" class="task-filters" role="tablist" aria-label="Filter tasks">
            <button type="button" class="filter-tab" id="filter-tab-ALL" data-filter="ALL" role="tab">All</button>
            <button type="button" class="filter-tab" id="filter-tab-ACTIVE" data-filter="ACTIVE" role="tab">Active</button>
            <button type="button" class="filter-tab" id="filter-tab-DUE_SOON" data-filter="DUE_SOON" role="tab">Due Soon</button>
            <button type="button" class="filter-tab" id="filter-tab-OVERDUE" data-filter="OVERDUE" role="tab">Overdue</button>
          </div>

          <div id="tasks-alert" aria-live="polite"></div>

          <div id="tasks-list" class="task-card-list"></div>
        </div>
      </main>
    </div>

    <nav id="shell-bottom-nav" class="bottom-nav" aria-label="Main navigation"></nav>
  </div>

  <div id="task-modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
      <h2 id="task-modal-title">Create Task</h2>
      <div id="task-form-alert" aria-live="polite"></div>
      <form id="task-form" novalidate>
        <input type="hidden" id="task-id" />
        <div class="form-field">
          <label class="form-label" for="task-title">Title</label>
          <input class="form-input" type="text" id="task-title" name="title" required maxlength="200" />
        </div>
        <div class="form-field">
          <label class="form-label" for="task-subject">Subject</label>
          <select class="form-input" id="task-subject" name="subjectId" required></select>
        </div>
        <div class="form-field">
          <label class="form-label" for="task-description">Description</label>
          <textarea class="form-input" id="task-description" name="description" rows="4" maxlength="5000"></textarea>
        </div>
        <div class="form-field">
          <label class="form-label" for="task-deadline">Deadline (optional)</label>
          <input class="form-input" type="datetime-local" id="task-deadline" name="deadline" />
        </div>
        <div class="form-field">
          <label class="form-label" for="task-submission-url">Submission link (optional)</label>
          <input class="form-input" type="url" id="task-submission-url" name="submissionUrl" placeholder="https://..." />
          <p class="form-hint">Where students should submit their work, if applicable.</p>
        </div>
        <div class="form-field">
          <label class="form-label" for="task-submission-label">Submission link label (optional)</label>
          <input class="form-input" type="text" id="task-submission-label" name="submissionLabel" maxlength="100" />
        </div>
        <div class="class-card__actions">
          <button type="submit" class="btn btn--primary" id="task-form-submit">Create Task</button>
          <button type="button" class="btn btn--secondary" id="task-form-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/pages/doctor-tasks.js"></script>
</body>
</html>
